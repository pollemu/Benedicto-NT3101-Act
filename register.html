<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | WebDev Activity</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px 20px;
        }

        .box {
            max-width: 380px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ccc;
            padding: 25px;
        }

        h1 {
            font-size: 22px;
            color: #333;
            margin: 0 0 5px;
        }

        p.sub {
            color: #777;
            font-size: 14px;
            margin: 0 0 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #999;
            font-size: 14px;
        }

        input.bad {
            border: 1px solid #cc0000;
            background: #fff5f5;
        }

        label.error {
            display: block;
            margin: -10px 0 15px;
            color: #cc0000;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: none;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #000;
        }

        #message {
            display: none;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 13px;
        }

        #message.error {
            display: block;
            background: #ffe6e6;
            color: #cc0000;
            border: 1px solid #cc0000;
        }

        #message.success {
            display: block;
            background: #e6ffe6;
            color: #006600;
            border: 1px solid #006600;
        }

        .link {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }

        .link a {
            color: #0066cc;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Create Account</h1>
        <p class="sub">Fill in the form to register</p>

        <div id="message"></div>

        <form id="register-form" novalidate>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">

            <label for="email">Email</label>
            <input type="text" id="email" name="email" placeholder="Enter your email">

            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password">

            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" placeholder="Repeat your password">

            <button type="submit">Register</button>
        </form>

        <p class="link">Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/jquery.validate.min.js"></script>
    <script>
        $(document).ready(function () {
            if (localStorage.getItem('webdev_session')) {
                window.location.replace('landing_page.html');
            }

            $('#register-form').validate({
                rules: {
                    name: {
                        required: true,
                        minlength: 2
                    },
                    email: {
                        required: true,
                        email: true
                    },
                    username: {
                        required: true,
                        minlength: 3
                    },
                    password: {
                        required: true,
                        minlength: 5
                    },
                    confirm: {
                        required: true,
                        equalTo: '#password'
                    }
                },
                messages: {
                    name: {
                        required: 'Please enter your name.',
                        minlength: 'Name must be at least 2 characters.'
                    },
                    email: {
                        required: 'Please enter your email.',
                        email: 'Please enter a valid email address.'
                    },
                    username: {
                        required: 'Please enter your username.',
                        minlength: 'Username must be at least 3 characters.'
                    },
                    password: {
                        required: 'Please enter your password.',
                        minlength: 'Password must be at least 5 characters.'
                    },
                    confirm: {
                        required: 'Please repeat your password.',
                        equalTo: 'Passwords do not match.'
                    }
                },
                highlight: function (element) {
                    $(element).addClass('bad');
                },
                unhighlight: function (element) {
                    $(element).removeClass('bad');
                },
                submitHandler: function (form) {
                    var users = getUsers();

                    users.push({
                        name: $.trim($('#name').val()),
                        email: $.trim($('#email').val()),
                        username: $.trim($('#username').val()),
                        password: $('#password').val()
                    });

                    localStorage.setItem('webdev_users', JSON.stringify(users));

                    form.reset();

                    $('#message')
                        .removeClass('error')
                        .addClass('success')
                        .text('Registered successfully. You can now login.');

                    return false;
                }
            });

            $('#register-form input').on('keyup', function () {
                $('#message').removeClass('error success').text('');
            });
        });

        function getUsers() {
            return JSON.parse(localStorage.getItem('webdev_users') || '[]');
        }
    </script>
</body>
</html>
