<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | WebDev Activity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #dc2626;
            --red-dark: #b91c1c;
            --red-soft: #fef2f2;
            --white: #ffffff;
            --ink: #1f2937;
            --muted: #6b7280;
            --line: #e5e7eb;
            --green: #059669;
            --green-soft: #ecfdf5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", Arial, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 15% 15%, rgba(239, 68, 68, 0.16), transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(220, 38, 38, 0.14), transparent 45%),
                #fff5f5;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: var(--white);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 22px 50px rgba(185, 28, 28, 0.18);
        }

        .card-header {
            background: linear-gradient(135deg, var(--red) 0%, #ef4444 100%);
            color: var(--white);
            text-align: center;
            padding: 30px 28px 26px;
        }

        .icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-header h1 {
            font-size: 1.45rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .card-header p {
            font-size: 0.88rem;
            opacity: 0.9;
            margin-top: 4px;
        }

        .card-body {
            padding: 26px 28px 28px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.83rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 13px;
            font-family: inherit;
            font-size: 0.92rem;
            color: var(--ink);
            background: #fafafa;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        input::placeholder {
            color: #9ca3af;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            background: var(--white);
            border-color: var(--red);
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.14);
        }

        input.bad {
            border-color: var(--red);
            background: var(--red-soft);
        }

        label.error {
            display: block;
            margin-top: 6px;
            color: var(--red);
            font-size: 0.78rem;
            font-weight: 500;
        }

        label.error::before {
            content: "! ";
            font-weight: 700;
        }

        button {
            width: 100%;
            margin-top: 6px;
            padding: 12px 18px;
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--white);
            background: linear-gradient(135deg, var(--red) 0%, #ef4444 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(220, 38, 38, 0.3);
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
        }

        button:hover {
            background: linear-gradient(135deg, var(--red-dark) 0%, var(--red) 100%);
            box-shadow: 0 10px 22px rgba(220, 38, 38, 0.36);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .alert {
            display: none;
            margin-bottom: 18px;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .alert.error {
            display: block;
            background: var(--red-soft);
            color: var(--red-dark);
            border: 1px solid #fecaca;
        }

        .alert.success {
            display: block;
            background: var(--green-soft);
            color: var(--green);
            border: 1px solid #a7f3d0;
        }

        .foot {
            margin-top: 18px;
            text-align: center;
            font-size: 0.86rem;
            color: var(--muted);
        }

        .foot a {
            color: var(--red);
            font-weight: 600;
            text-decoration: none;
        }

        .foot a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M19 8v6"></path>
                    <path d="M22 11h-6"></path>
                </svg>
            </div>
            <h1>Create Account</h1>
            <p>It only takes a minute</p>
        </div>

        <div class="card-body">
            <div id="message" class="alert"></div>

            <form id="register-form" novalidate>
                <div class="field">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name">
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" placeholder="Enter your email">
                </div>

                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 5 characters">
                </div>

                <div class="field">
                    <label for="confirm">Confirm Password</label>
                    <input type="password" id="confirm" name="confirm" placeholder="Repeat your password">
                </div>

                <button type="submit">Register</button>
            </form>

            <p class="foot">Already have an account? <a href="login.html">Login instead</a></p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/jquery.validate.min.js"></script>
    <script>
        $(document).ready(function () {
            if (localStorage.getItem('webdev_session')) {
                window.location.replace('landing_page.html');
            }

            $('#register-form').validate({
                rules: {
                    name: {
                        required: true,
                        minlength: 2
                    },
                    email: {
                        required: true,
                        email: true
                    },
                    username: {
                        required: true,
                        minlength: 3
                    },
                    password: {
                        required: true,
                        minlength: 5
                    },
                    confirm: {
                        required: true,
                        equalTo: '#password'
                    }
                },
                messages: {
                    name: {
                        required: 'Please enter your name.',
                        minlength: 'Name must be at least 2 characters.'
                    },
                    email: {
                        required: 'Please enter your email.',
                        email: 'Please enter a valid email address.'
                    },
                    username: {
                        required: 'Please enter your username.',
                        minlength: 'Username must be at least 3 characters.'
                    },
                    password: {
                        required: 'Please enter your password.',
                        minlength: 'Password must be at least 5 characters.'
                    },
                    confirm: {
                        required: 'Please repeat your password.',
                        equalTo: 'Passwords do not match.'
                    }
                },
                highlight: function (element) {
                    $(element).addClass('bad');
                },
                unhighlight: function (element) {
                    $(element).removeClass('bad');
                },
                submitHandler: function (form) {
                    var users = getUsers();

                    users.push({
                        name: $.trim($('#name').val()),
                        email: $.trim($('#email').val()),
                        username: $.trim($('#username').val()),
                        password: $('#password').val()
                    });

                    localStorage.setItem('webdev_users', JSON.stringify(users));

                    form.reset();

                    $('#message')
                        .removeClass('error')
                        .addClass('success')
                        .text('Registered successfully. You can now login.');

                    return false;
                }
            });

            $('#register-form input').on('keyup', function () {
                $('#message').removeClass('error success').text('');
            });
        });

        function getUsers() {
            return JSON.parse(localStorage.getItem('webdev_users') || '[]');
        }
    </script>
</body>
</html>
