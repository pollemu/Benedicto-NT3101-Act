<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | WebDev Activity</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px 20px;
        }

        .box {
            max-width: 380px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ccc;
            padding: 25px;
        }

        h1 {
            font-size: 22px;
            color: #333;
            margin: 0 0 5px;
        }

        p.sub {
            color: #777;
            font-size: 14px;
            margin: 0 0 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #999;
            font-size: 14px;
        }

        input.bad {
            border: 1px solid #cc0000;
            background: #fff5f5;
        }

        label.error {
            display: block;
            margin: -10px 0 15px;
            color: #cc0000;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: none;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #000;
        }

        #message {
            display: none;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 13px;
        }

        #message.error {
            display: block;
            background: #ffe6e6;
            color: #cc0000;
            border: 1px solid #cc0000;
        }

        #message.success {
            display: block;
            background: #e6ffe6;
            color: #006600;
            border: 1px solid #006600;
        }

        .demo {
            margin-top: 15px;
            font-size: 13px;
            color: #555;
            text-align: center;
        }

        .link {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }

        .link a {
            color: #0066cc;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>WebDev Activity</h1>
        <p class="sub">Please login to continue</p>

        <div id="message"></div>

        <form id="login-form" novalidate>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password">

            <button type="submit">Login</button>
        </form>

        <p class="demo">Username: <b>admin</b> &nbsp;|&nbsp; Password: <b>12345</b></p>
        <p class="link">No account yet? <a href="register.html">Register here</a></p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/jquery.validate.min.js"></script>
    <script>
        $(document).ready(function () {
            if (localStorage.getItem('webdev_session')) {
                window.location.replace('landing_page.html');
            }

            $('#login-form').validate({
                rules: {
                    username: {
                        required: true,
                        minlength: 3
                    },
                    password: {
                        required: true,
                        minlength: 5
                    }
                },
                messages: {
                    username: {
                        required: 'Please enter your username.',
                        minlength: 'Username must be at least 3 characters.'
                    },
                    password: {
                        required: 'Please enter your password.',
                        minlength: 'Password must be at least 5 characters.'
                    }
                },
                highlight: function (element) {
                    $(element).addClass('bad');
                },
                unhighlight: function (element) {
                    $(element).removeClass('bad');
                },
                submitHandler: function () {
                    var username = $.trim($('#username').val());
                    var password = $('#password').val();
                    var valid = checkLogin(username, password);

                    if (valid === false) {
                        $('#message')
                            .removeClass('success')
                            .addClass('error')
                            .text('Wrong username or password. Please try again.');
                        return false;
                    }

                    localStorage.setItem('webdev_session', username);

                    $('#message')
                        .removeClass('error')
                        .addClass('success')
                        .text('Login successful. Opening your page...');

                    setTimeout(function () {
                        window.location.href = 'landing_page.html';
                    }, 700);

                    return false;
                }
            });

            $('#login-form input').on('keyup', function () {
                $('#message').removeClass('error success').text('');
            });
        });

        function getUsers() {
            return JSON.parse(localStorage.getItem('webdev_users') || '[]');
        }

        function checkLogin(username, password) {
            var users = getUsers();

            users.push({
                username: 'admin',
                password: '12345'
            });

            for (var i = 0; i < users.length; i++) {
                if (users[i].username === username && users[i].password === password) {
                    return true;
                }
            }

            return false;
        }
    </script>
</body>
</html>
