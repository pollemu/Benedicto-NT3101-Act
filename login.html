<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #dc2626;
            --red-dark: #b91c1c;
            --red-soft: #fef2f2;
            --white: #ffffff;
            --ink: #1f2937;
            --muted: #6b7280;
            --line: #e5e7eb;
            --green: #059669;
            --green-soft: #ecfdf5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", Arial, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 15% 15%, rgba(239, 68, 68, 0.16), transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(220, 38, 38, 0.14), transparent 45%),
                #fff5f5;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: var(--white);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 22px 50px rgba(185, 28, 28, 0.18);
            animation: fadeUp 0.45s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        .card-header {
            background: linear-gradient(135deg, var(--red) 0%, #ef4444 100%);
            color: var(--white);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 22px 26px;
        }

        .icon {
            width: 46px;
            height: 46px;
            flex: 0 0 46px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-header h1 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .card-header p {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-top: 2px;
        }

        .card-body {
            padding: 26px 28px 28px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.83rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 13px;
            font-family: inherit;
            font-size: 0.92rem;
            color: var(--ink);
            background: #fafafa;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        input::placeholder {
            color: #9ca3af;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            background: var(--white);
            border-color: var(--red);
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.14);
        }

        input.bad {
            border-color: var(--red);
            background: var(--red-soft);
        }

        label.error {
            display: block;
            margin-top: 6px;
            color: var(--red);
            font-size: 0.78rem;
            font-weight: 500;
        }

        label.error::before {
            content: "! ";
            font-weight: 700;
        }

        button {
            width: 100%;
            margin-top: 6px;
            padding: 12px 18px;
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--white);
            background: linear-gradient(135deg, var(--red) 0%, #ef4444 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(220, 38, 38, 0.3);
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
        }

        button:hover {
            background: linear-gradient(135deg, var(--red-dark) 0%, var(--red) 100%);
            box-shadow: 0 10px 22px rgba(220, 38, 38, 0.36);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .alert {
            display: none;
            margin-bottom: 18px;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .alert.error {
            display: block;
            background: var(--red-soft);
            color: var(--red-dark);
            border: 1px solid #fecaca;
        }

        .alert.success {
            display: block;
            background: var(--green-soft);
            color: var(--green);
            border: 1px solid #a7f3d0;
        }

        .demo {
            margin-top: 20px;
            padding: 11px 14px;
            background: var(--red-soft);
            border: 1px dashed #fca5a5;
            border-radius: 10px;
            color: #7f1d1d;
            font-size: 0.82rem;
            text-align: center;
        }

        .foot {
            margin-top: 18px;
            text-align: center;
            font-size: 0.86rem;
            color: var(--muted);
        }

        .foot a {
            color: var(--red);
            font-weight: 600;
            text-decoration: none;
        }

        .foot a:hover {
            text-decoration: underline;
        }

        @media (prefers-reduced-motion: reduce) {
            .card {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="10" width="16" height="10" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>
            </div>
            <div>
                <h1>Login</h1>
                <p>Please login to continue</p>
            </div>
        </div>

        <div class="card-body">
            <div id="message" class="alert"></div>

            <form id="login-form" novalidate>
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                </div>

                <button type="submit">Login</button>
            </form>

            <p class="demo">Username: <strong>admin</strong> &nbsp;&middot;&nbsp; Password: <strong>12345</strong></p>
            <p class="foot">No account yet? <a href="register.html">Create one</a></p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/jquery.validate.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#login-form').validate({
                rules: {
                    username: {
                        required: true,
                        minlength: 3
                    },
                    password: {
                        required: true,
                        minlength: 5
                    }
                },
                messages: {
                    username: {
                        required: 'Please enter your username.',
                        minlength: 'Username must be at least 3 characters.'
                    },
                    password: {
                        required: 'Please enter your password.',
                        minlength: 'Password must be at least 5 characters.'
                    }
                },
                highlight: function (element) {
                    $(element).addClass('bad');
                },
                unhighlight: function (element) {
                    $(element).removeClass('bad');
                },
                submitHandler: function () {
                    var username = $.trim($('#username').val());
                    var password = $('#password').val();
                    var valid = checkLogin(username, password);

                    if (valid === false) {
                        $('#message')
                            .removeClass('success')
                            .addClass('error')
                            .text('Wrong username or password. Please try again.');
                        return false;
                    }

                    localStorage.setItem('webdev_session', username);

                    $('#message')
                        .removeClass('error')
                        .addClass('success')
                        .text('Login successful. Opening your page...');

                    setTimeout(function () {
                        window.location.href = 'landing_page.html';
                    }, 700);

                    return false;
                }
            });

            $('#login-form input').on('keyup', function () {
                $('#message').removeClass('error success').text('');
            });
        });

        function getUsers() {
            return JSON.parse(localStorage.getItem('webdev_users') || '[]');
        }

        function checkLogin(username, password) {
            var users = getUsers();

            users.push({
                username: 'admin',
                password: '12345'
            });

            for (var i = 0; i < users.length; i++) {
                if (users[i].username === username && users[i].password === password) {
                    return true;
                }
            }

            return false;
        }
    </script>
</body>
</html>
