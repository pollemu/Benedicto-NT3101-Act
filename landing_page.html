<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing | WebDev Activity</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px 20px;
        }

        .box {
            max-width: 380px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ccc;
            padding: 25px;
        }

        h1 {
            font-size: 22px;
            color: #333;
            margin: 0 0 5px;
        }

        p.sub {
            color: #777;
            font-size: 14px;
            margin: 0 0 20px;
        }

        .info {
            border: 1px solid #ccc;
            background: #fafafa;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: none;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #000;
        }

        p.note {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1 id="welcome">Welcome!</h1>
        <p class="sub">You are now logged in.</p>

        <div class="info">
            This page can only be seen after a successful login.
        </div>

        <button type="button" id="logout">Logout</button>

        <p class="note">Logging out will bring you back to the login page.</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            var username = localStorage.getItem('webdev_session');

            if (!username) {
                window.location.replace('login.html');
                return;
            }

            $('#welcome').text('Welcome, ' + username + '!');

            $('#logout').click(function () {
                localStorage.removeItem('webdev_session');
                window.location.replace('login.html');
            });
        });
    </script>
</body>
</html>
